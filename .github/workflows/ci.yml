name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: types
        run: npm run typecheck

      # build mode hands a cheap model write access to a folder on your disk.
      # the parts that say no are worth testing without a model in the loop.
      - name: the jail holds
        run: npm run check:jail

      - name: the planner reads what models actually send
        run: npm run check:json

      - name: build the window
        run: npm run build

      # art.ts is DOM-free on purpose, so the sprites can be validated without a
      # browser: wrong row length, unknown palette char, or an asset nothing draws.
      - name: pixel art
        run: npm run art

      - name: the renderer still renders
        run: npm run shots

      # the launcher is the documented way in, so it gets tested like one
      - name: the floor comes up
        run: |
          node bin/nightshift.mjs --no-open --port 20255 &
          floor=$!
          for i in $(seq 1 40); do
            sleep 1
            curl -sf localhost:20255/api/health > /dev/null && break
          done
          curl -sf localhost:20255/api/health | tee /dev/stderr | grep -q '"ok":true'
          curl -sf -o /dev/null localhost:20255/            # the built window is served
          kill $floor
